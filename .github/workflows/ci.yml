# 빌드 + 시험 (push · PR). 실제 설계 모델이 필요한 시험은 MNS_REAL_MODELS 가 없으면 스스로 건너뛴다.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 앱 · 시험은 net8.0, MnS.slnx 는 SDK 9.0.200 이상이 필요하다
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build MnS.slnx -c Release
      - name: Test
        run: dotnet test MnS.slnx -c Release --no-build --logger "trx;LogFileName=test.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
