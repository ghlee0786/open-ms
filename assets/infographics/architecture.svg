<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Open M&amp;S 전체 구조</title>
  <desc id="d">입력(Fusion 내보내기 · 시나리오 JSON · 공개 샘플) → 시뮬레이터(6DOF 엔진 · GPU 몬테카를로 · 근사 구조 분석 · 3D 재생) → 외부 해석기(CalculiX · OpenCourant · OpenFOAM · XLB, 선택) → 결과(.mnsr · 결과 폴더 · 보고서 · Blender).</desc>
