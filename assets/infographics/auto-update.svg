  <text x="28" y="38" font-size="20" fill="#f4f4f5" font-weight="700">자동 업데이트</text>
  <text x="28" y="60" font-size="13.5" fill="#a1a1aa">설치판은 GitHub 릴리스를 스스로 확인하고, 사용자가 고르면 내려받아 검증한 뒤 조용히 설치하고 다시 켠다</text>
