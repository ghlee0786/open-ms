<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">자동 업데이트</title>
  <desc id="d">시작 5초 뒤 하루 1회 확인 → GitHub 릴리스의 OpenMS-Setup-x.y.z.exe 찾기 → 새 버전 대화상자 → 내려받기 · SHA-256 검증 → /SILENT 설치 → 새 버전으로 재실행.</desc>
