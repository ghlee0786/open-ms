  <rect x="24" y="324" width="912" height="72" rx="12" fill="#171b23"/>
  <text x="44" y="350" font-size="13.5" fill="#f4f4f5" font-weight="700">조용히 넘기는 경우</text>
  <text x="44" y="372" font-size="12.5" fill="#a1a1aa">오프라인 · 시간 초과 · 404(릴리스 없음) · 403/429(요청 한도)는 대화상자 없이 로그만 남기고 다음 시작 때 다시 확인한다.</text>
  <text x="44" y="389" font-size="12.5" fill="#a1a1aa">개발 빌드(버전 0.0.0)는 확인하지 않는다 · 건너뛴 버전은 자동 확인에서만 숨긴다 · 설치 위치 %LOCALAPPDATA%\Programs\OpenMS (관리자 권한 불필요)</text>
