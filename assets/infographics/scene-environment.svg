<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">장면 환경 — 하늘 · 지면 · 조명</title>
  <desc id="d">config/environments/&lt;id&gt;/environment.json → 하늘 돔(절차적 하늘) · 지면 텍스처 · 태양 방향광과 그림자 → 시나리오 토양으로 자동 선택 → 3D 화면. 해석 결과는 바뀌지 않고 그림만 바뀐다.</desc>
