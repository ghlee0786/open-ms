<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">구조 · 충격 해석 파이프라인</title>
  <desc id="d">하중 케이스(구간 최대 · 개방 충격 · 착지) → 메시(Gmsh 사면체) → CalculiX(정적 · 고유진동 · 좌굴 · 모달 과도) 또는 OpenCourant(착지 충돌) → 안전율 · 99 % 응력 · 고유진동 · 진동 피로 → 3D 응력 색 · 보고서.</desc>
