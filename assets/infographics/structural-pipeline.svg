  <text x="480" y="426" font-size="12.5" fill="#71717a" text-anchor="middle">판정 기준: 안전율 = 허용 응력 / 응력. 최대값은 모서리 특이점에 민감해 99 % 백분위 응력과 메시 수렴(굵게 · 국부 절반)을 함께 본다</text>
  <text x="480" y="448" font-size="12.5" fill="#71717a" text-anchor="middle">재질은 재질 라이브러리 · Fusion 재료 물성 · 시나리오 지정 순으로 우선한다</text>
