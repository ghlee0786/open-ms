<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <title>Fusion 내보내기 스크립트(MnS_ExportForSim)의 질문 순서 — 설명 그림</title>
  <desc>폴더 선택 → 이름 입력 → STEP 도 내보낼까요? → USD 도 내보낼까요? → 내보내기 완료 메시지. Fusion 화면을 찍은 그림이 아니라 질문 순서를 그린 도식이다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb2e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="340" rx="16" fill="#1d2430"/>
  <text x="24" y="38" font-size="18" font-weight="600" fill="#e8edf3">Fusion 360 → 스크립트 MnS_ExportForSim 실행 시 묻는 순서</text>
  <text x="24" y="60" font-size="12.5" fill="#9aa6b5">설명 그림(Fusion 화면 캡처 아님) — 대화상자 문구는 스크립트 원문</text>

  <!-- 1 폴더 -->
  <g transform="translate(24,84)">
    <rect width="208" height="150" rx="8" fill="#f4f6f9" stroke="#c9d1db"/>
    <rect width="208" height="28" rx="8" fill="#dde3ea"/>
    <rect y="20" width="208" height="8" fill="#dde3ea"/>
    <text x="10" y="19" font-size="12" font-weight="600" fill="#222">① 폴더 선택</text>
    <text x="12" y="52" font-size="12" fill="#333">시뮬레이터용 내보내기</text>
    <text x="12" y="68" font-size="12" fill="#333">폴더 선택</text>
    <rect x="12" y="80" width="184" height="22" rx="3" fill="#fff" stroke="#b8c2ce"/>
    <text x="18" y="95" font-size="11" fill="#666">…\exports</text>
    <rect x="110" y="116" width="86" height="24" rx="4" fill="#2a7de1"/>
    <text x="153" y="132" font-size="12" fill="#fff" text-anchor="middle">폴더 선택</text>
  </g>
  <!-- 2 이름 -->
  <g transform="translate(260,84)">
    <rect width="208" height="150" rx="8" fill="#f4f6f9" stroke="#c9d1db"/>
    <rect width="208" height="28" rx="8" fill="#dde3ea"/>
    <rect y="20" width="208" height="8" fill="#dde3ea"/>
    <text x="10" y="19" font-size="12" font-weight="600" fill="#222">② 이름</text>
    <text x="12" y="52" font-size="12" fill="#333">내보내기 이름 (파일 이름)</text>
    <rect x="12" y="66" width="184" height="22" rx="3" fill="#fff" stroke="#2a7de1"/>
    <text x="18" y="81" font-size="11" fill="#222">spike_sensor_sample</text>
    <rect x="62" y="116" width="62" height="24" rx="4" fill="#2a7de1"/>
    <text x="93" y="132" font-size="12" fill="#fff" text-anchor="middle">확인</text>
    <rect x="132" y="116" width="64" height="24" rx="4" fill="#fff" stroke="#b8c2ce"/>
    <text x="164" y="132" font-size="12" fill="#333" text-anchor="middle">취소</text>
  </g>
  <!-- 3 STEP -->
  <g transform="translate(496,84)">
    <rect width="208" height="150" rx="8" fill="#f4f6f9" stroke="#c9d1db"/>
    <rect width="208" height="28" rx="8" fill="#dde3ea"/>
    <rect y="20" width="208" height="8" fill="#dde3ea"/>
    <text x="10" y="19" font-size="12" font-weight="600" fill="#222">③ STEP (선택)</text>
    <text x="12" y="54" font-size="12" fill="#333">FEA(CalculiX) 용 STEP 도</text>
    <text x="12" y="70" font-size="12" fill="#333">내보낼까요?</text>
    <rect x="62" y="116" width="62" height="24" rx="4" fill="#2a7de1"/>
    <text x="93" y="132" font-size="12" fill="#fff" text-anchor="middle">예</text>
    <rect x="132" y="116" width="64" height="24" rx="4" fill="#fff" stroke="#b8c2ce"/>
    <text x="164" y="132" font-size="12" fill="#333" text-anchor="middle">아니요</text>
  </g>
  <!-- 4 USD -->
  <g transform="translate(732,84)">
    <rect width="204" height="150" rx="8" fill="#f4f6f9" stroke="#c9d1db"/>
    <rect width="204" height="28" rx="8" fill="#dde3ea"/>
    <rect y="20" width="204" height="8" fill="#dde3ea"/>
    <text x="10" y="19" font-size="12" font-weight="600" fill="#222">④ USD (선택)</text>
    <text x="12" y="54" font-size="12" fill="#333">USD(재질·외관 포함)도</text>
    <text x="12" y="70" font-size="12" fill="#333">내보낼까요?</text>
    <rect x="58" y="116" width="62" height="24" rx="4" fill="#2a7de1"/>
    <text x="89" y="132" font-size="12" fill="#fff" text-anchor="middle">예</text>
    <rect x="128" y="116" width="64" height="24" rx="4" fill="#fff" stroke="#b8c2ce"/>
    <text x="160" y="132" font-size="12" fill="#333" text-anchor="middle">아니요</text>
  </g>
  <g stroke="#7fb2e5" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M234,159 L256,159"/>
    <path d="M470,159 L492,159"/>
    <path d="M706,159 L728,159"/>
  </g>
  <!-- 완료 -->
  <g transform="translate(24,254)">
    <rect width="912" height="66" rx="8" fill="#26303d" stroke="#3b4757"/>
    <text x="14" y="26" font-size="13" font-weight="600" fill="#9fe3b0">내보내기 완료: N 바디 · 질량 … kg, CG = (…) m</text>
    <text x="14" y="48" font-size="12" fill="#c3ccd7">&lt;이름&gt;.stl · &lt;이름&gt;.massprops.json(+ 고르면 .step · .usdz) — 시뮬레이터 파일 → 모델 가져오기(Ctrl+I)로 엽니다.</text>
  </g>
</svg>
